questions:
  - variable: model.name
    label: "Model Name"
    description: "HuggingFace model ID to serve"
    type: string
    default: "mistralai/Mistral-7B-Instruct-v0.3"
    required: true

  - variable: resources.gpu
    label: "GPU"
    description: "Number of GPUs per pod"
    type: enum
    options:
      - "1"
      - "2"
      - "4"
    default: "1"
    required: true
    
  - variable: resources.cpu
    label: "CPU"
    description: "Number of CPU cores per pod"
    type: string
    default: "8"
    required: true
    
  - variable: resources.memory
    label: "Memory"
    description: "Max memory usage (in Gi)"
    type: string
    default: "16"
    required: true
    
  - variable: storage.pvc
    label: "PVC name"
    description: "Name of the PVC for weight caching"
    type: string
    default: "vllm-cache"
    required: true

  - variable: storage.create
    label: "Create storage PVC"
    description: "Create a separate PVC for weight caching"
    type: boolean
    default: true
    required: true
    
  - variable: httpRoute.enabled
    label: "Enable HTTPRoute"
    description: "Create HTTPRoute for external access via gateway"
    type: boolean
    default: true
    show_subquestions_if: true
    subquestions:
      - variable: httpRoute.subdomain
        label: "Subdomain"
        description: "Subdomain for the HTTPRoute (under .<your-proj>.disa.c3se.chalmers.se)"
        type: string
        default: "vllm"
        required: true
        show_if: "httpRoute.enabled=true"
      - variable: httpRoute.securityPolicy
        label: "SecurityPolicy"
        description: "Restrict access to endpoint with a security policy"
        type: boolean
        default: true
        required: true
        show_if: "httpRoute.enabled=true"
      - variable: httpRoute.allowedCidrs.0
        label: "Allowed CIDR"
        description: "Allowed CIDR to access the service (a list can be added in the yaml)"
        type: string
        default: "129.16.0.0/16"
        required: true
        show_if: "httpRoute.enabled=true"
