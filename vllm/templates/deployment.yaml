{{- $prefixes := dict
  "0.25" "quarter"
  "0.5" "half"
  "1" "one"
  "2" "two"
  "4" "four"
}}
{{- $count := printf "%v" .Values.resources.gpu }}
{{- $model := dict
  "NVIDIA A40" "a40"
  "NVIDIA A100-SXM4-80GB" "a100fat"
}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vllm.fullname" . }}
  labels:
    {{- include "vllm.labels" . | nindent 4 }}
spec:
  replicas: 1
  progressDeadlineSeconds: {{ .Values.deployment.progressDeadlineSeconds }}
  revisionHistoryLimit: {{ .Values.deployment.revisionHistoryLimit }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: "25%"
      maxUnavailable: "25%"
  selector:
    matchLabels:
      {{- include "vllm.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vllm.selectorLabels" . | nindent 8 }}
    spec:
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      containers:
      - name: vllm
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command:
          - /bin/sh
          - -c
        args:
          - >-
            vllm serve {{ .Values.model.name }}
            {{ join " " .Values.model.args }}
        ports:
        - name: http
          containerPort: {{ .Values.service.targetPort }}
          protocol: TCP
        startupProbe:
          httpGet:
            path: /health
            port: {{ .Values.service.targetPort }}
            scheme: HTTP
          initialDelaySeconds: {{ .Values.deployment.startupProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.deployment.startupProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.deployment.startupProbe.timeoutSeconds }}
          failureThreshold: {{ .Values.deployment.startupProbe.failureThreshold }}
          successThreshold: {{ .Values.deployment.startupProbe.successThreshold }}
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.service.targetPort }}
            scheme: HTTP
          periodSeconds: {{ .Values.deployment.livenessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.deployment.livenessProbe.timeoutSeconds }}
          failureThreshold: {{ .Values.deployment.livenessProbe.failureThreshold }}
          successThreshold: {{ .Values.deployment.livenessProbe.successThreshold }}
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.service.targetPort }}
            scheme: HTTP
          periodSeconds: {{ .Values.deployment.readinessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.deployment.readinessProbe.timeoutSeconds }}
          failureThreshold: {{ .Values.deployment.readinessProbe.failureThreshold }}
          successThreshold: {{ .Values.deployment.readinessProbe.successThreshold }}
        resources:
          requests:
            cpu: {{ .Values.resources.cpu }}
            memory: {{ .Values.resources.memory }}Gi
          limits:
            cpu: {{ .Values.resources.cpu }}
            memory: {{ .Values.resources.memory }}Gi
          claims:
          - name: {{ printf "%s-%s" (index $prefixes $count) (index $model .Values.resources.gpu_model) | quote }}
            request: {{ printf "%s%s" (ternary "mps-" "" (lt (.Values.resources.gpu | float64) 1.0)) "gpu" | quote }}
        volumeMounts:
        - name: cache-volume
          mountPath: /root/.cache/huggingface
        - name: shm
          mountPath: /dev/shm
      resourceClaims:
      - name: {{ printf "%s-%s" (index $prefixes $count) (index $model .Values.resources.gpu_model) | quote }}
        resourceClaimTemplateName: {{ printf "%s-%s" (index $prefixes $count) (index $model .Values.resources.gpu_model) | quote }}
      volumes:
      - name: cache-volume
        persistentVolumeClaim:
          claimName: vllm-cache
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi
