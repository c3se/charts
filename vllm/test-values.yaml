storage:
  pvc: "vllm-cache"
  storageClass: null
  create: false

httpRoute:
  enabled: true
  subdomain: "vllm"
  securityPolicy: true
  allowedCidrs:
    - 129.16.0.0/16

model:
  name: "nomic-ai/nomic-embed-text-v1.5"
  args:
    - "--trust-remote-code"
    - "--no-use-tqdm-on-load"
    - "--gpu-memory-utilization 0.08"

image:
  repository: vllm/vllm-openai
  tag: "v0.27.1"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

resources:
  cpu: 8
  memory: 16
  gpu: "0.25"
  gpu_model: "NVIDIA A40"

deployment:
  progressDeadlineSeconds: 1200
  revisionHistoryLimit: 3
  startupProbe:
    initialDelaySeconds: 60
    periodSeconds: 20
    timeoutSeconds: 1
    failureThreshold: 30
    successThreshold: 1
  readinessProbe:
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 6
    successThreshold: 1
  livenessProbe:
    timeoutSeconds: 1
    periodSeconds: 10
    successThreshold: 1
