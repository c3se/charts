questions:
  - variable: resources.cpu
    label: "CPU"
    description: "Number of CPU cores per pod"
    type: string
    default: "8"
    required: true

  - variable: resources.memory
    label: "Memory"
    description: "Max memory usage (in Gi)"
    type: string
    default: "16"
    required: true

  - variable: masterKey
    label: Litellm master key
    description: Must start with sk- followed by at least 48 hexadecimal characters. You can create with `echo sk-$(openssl rand -hex 24)`
    type: password
    required: true
    validChars: "^sk-[a-fA-F0-9]{48,}$"

  - variable: saltKey
    label: Litellm salt key
    description: Litellm salt key
    type: password
    required: false
    validChars: "^sk-[a-fA-F0-9]{48,}$"

  - variable: postgres.database
    label: Database name
    description: Postgresql database name
    type: string
    required: true
    group: Postgres

  - variable: postgres.username
    label: Database username
    description: Postgresql database username
    type: string
    required: true
    group: Postgres

  - variable: postgres.password
    label: Database password
    description: Postgresql database password
    type: string
    required: true
    group: Postgres

  - variable: redis.password
    label: Redis password
    description: Redis password
    type: string
    required: true
    group: Redis

  - variable: proxyConfig
    label: LiteLLM Proxy Configuration
    description: >-
      Paste your LiteLLM config.yaml content.
      Use os.environ/VARIABLE_NAME for secrets.
    type: multiline
    required: true
    group: LiteLLM Configuration

  - variable: secretEnvText
    label: Secret environment variables
    description: >-
      Enter one KEY=value pair per line.
      Example: OPENAI_API_KEY=your-api-key
      Do not use quotes around values.
    type: multiline
    required: false
    group: Secrets

  - variable: httpRoute.enabled
    label: "Enable HTTPRoute"
    description: "Create HTTPRoute for external access via gateway"
    type: boolean
    default: true
    show_subquestions_if: true
    subquestions:
      - variable: httpRoute.subdomain
        label: "Subdomain"
        description: "Subdomain for the HTTPRoute (under .<your-proj>.disa.c3se.chalmers.se)"
        type: string
        default: "litellm"
        required: true
        show_if: "httpRoute.enabled=true"
      - variable: httpRoute.securityPolicy
        label: "SecurityPolicy"
        description: "Restrict access to endpoint with a security policy"
        type: boolean
        default: true
        required: true
        show_if: "httpRoute.enabled=true"
      - variable: httpRoute.allowedCidrs.0
        label: "Allowed CIDR"
        description: "Allowed CIDR to access the service (a list can be added in the yaml)"
        type: string
        default: "129.16.0.0/16"
        required: true
        show_if: "httpRoute.enabled=true"
