apiVersion: v1
kind: Secret
metadata:
  name: {{ include "litellm.fullname" . }}-valkey-secret
stringData:
  username: default
  password: litellm
type: kubernetes.io/basic-auth
---
apiVersion: valkey.io/v1alpha1
kind: ValkeyCluster
metadata:
  name: {{ include "litellm.fullname" . }}-valkey-cluster
  # name: litellm-valkey-cluster
spec:
  shards: 1
  replicas: 0
  workloadType: Deployment
  # persistence:
  #   size: 8Gi
  #   storageClassName: gp3
  #   reclaimPolicy: Retain
  users:
    - name: default
      # nopass: true
      passwordSecret:
        name: {{ include "litellm.fullname" . }}-valkey-secret
        keys:
          - password
      permissions: "+@all ~* &*"
  config:
    appendonly: "yes"
