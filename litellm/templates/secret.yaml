{{- $ns := lookup "v1" "Namespace" "" .Release.Namespace  -}}
{{- $dirname := dig "metadata" "labels" "c3se.chalmers.se/directoryName" "c3-staff" ($ns | default dict) -}}
{{- $hostname := printf "%s.%s.disa.c3se.chalmers.se" .Values.httpRoute.subdomain $dirname -}}
{{- $dbname := .Values.postgres.database }}
{{- $dbuser := .Values.postgres.username }}
{{- $dbpassword := .Values.postgres.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "litellm.fullname" . }}-env
  labels:
    {{- include "litellm.labels" . | nindent 4 }}
type: Opaque
stringData:
  LITELLM_MASTER_KEY: {{ .Values.masterKey }}
  LITELLM_SALT_KEY: {{ .Values.saltKey }}
  DATABASE_URL: postgresql://{{ $dbuser }}:{{ $dbpassword }}@{{ include "litellm.fullname" . }}-pg-cluster-rw:5432/{{ $dbname }}
  PROXY_BASE_URL: {{ printf "https://%s" $hostname }}
  REDIS_HOST: {{ include "litellm.fullname" . }}-valkey-cluster
  REDIS_PASSWORD: {{ .Values.redis.password }}
  STORE_MODEL_IN_DB: True
  {{- $env := .Values.secretEnvText | default "" }}
  {{- if $env }}
  {{- range $line := splitList "\n" $env }}
  {{- $line = trim $line }}
  {{- if and $line (not (hasPrefix "#" $line)) }}
  {{- $parts := splitList "=" $line }}
  {{- $key := trim (first $parts) }}
  {{- $value := trim (join "=" (rest $parts)) }}
  {{- if and $key (regexMatch "^[A-Za-z_][A-Za-z0-9_]*$" $key) }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  # GENERIC_CLIENT_ID
  # GENERIC_CLIENT_SECRET
  # GENERIC_AUTHORIZATION_ENDPOINT
  # GENERIC_TOKEN_ENDPOINT
  # GENERIC_USERINFO_ENDPOINT
  # GENERIC_USER_ROLE_ATTRIBUTE
  # ENABLE_SSO_DEBUG
  # JWT_PUBLIC_KEY_URL
  # DISABLE_SCHEMA_UPDATE
  {{- end }}

