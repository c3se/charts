apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "litellm.fullname" . }}-config
  labels:
    {{- include "litellm.labels" . | nindent 4 }}
data:
  config.yaml: |
    general_settings:
      master_key: sk-493b8f20478d1e6931ae4e97e9de733b
      # database_url: postgresql://$(DATABASE_USERNAME):$(DATABASE_PASSWORD)@$(DATABASE_HOST):$(DATABASE_PORT)/$(DATABASE_NAME)
      database_url: postgresql://litellm:litellm@{{ include "litellm.fullname" . }}-pg-cluster-rw:5432/litellm
    litellm_settings:
      drop_params: true
    router_settings:
      redis_host: valkey-litellm-valkey-cluster
      redis_password: os.environ/REDIS_PASSWORD
{{- .Values.proxyConfig | nindent 4 }}
