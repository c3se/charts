replicaCount: 1

image:
  repository: ghcr.io/berriai/litellm
  tag: "v1.103.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 4000
  targetPort: 4000

httpRoute:
  enabled: true
  subdomain: "litellm"
  securityPolicy: true
  allowedCidrs:
    - 129.16.0.0/16

resources:
  cpu: 8
  memory: 8

proxyConfig: |
  general_settings:
    disable_env_credential_login: true
  litellm_settings:
    drop_params: true
  model_list:
    # Example:
    # - model_name: openai/gpt-oss-20b
    #   litellm_params:
    #     model: hosted_vllm/openai/gpt-oss-20b
    #     api_base: http://openai-gpt-oss-20b-vllm:8000/v1
    #   model_info:
    #     input_cost_per_token: 0.000001
    #     output_cost_per_token: 0.000002

secretEnvText: |
  STORE_MODEL_IN_DB=True # Turn this off if you only want static model list from config file.
  # Set following variables to enable SSO login
  # GENERIC_CLIENT_ID=
  # GENERIC_CLIENT_SECRET=
  # GENERIC_AUTHORIZATION_ENDPOINT=
  # GENERIC_TOKEN_ENDPOINT=
  # GENERIC_USERINFO_ENDPOINT=
  # GENERIC_USER_ROLE_ATTRIBUTE=

# Use an existing Secret for the master key.
masterKey: <your-secret-key>
saltKey: ""

postgres:
  database: litellm
  username: litellm
  password: litellm

redis:
  password: litellm

# Optional LiteLLM config.yaml content.
# Configure models here or manage them through the UI
# when a database is configured.
livenessProbe:
  enabled: true
  path: /health/liveliness
  initialDelaySeconds: 60
  periodSeconds: 15

readinessProbe:
  enabled: true
  path: /health/readiness
  initialDelaySeconds: 30
  periodSeconds: 10

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
